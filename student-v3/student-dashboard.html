        /* 전역 CSS 변수 오버라이드 */
        :root {
            --primary: #6A0028 !important;
            --primary-dark: #4A001C !important;
            --primary-light: #8A0034 !important;
        }

        /* 사이드바 검정 배경 + Active만 크림슨 */
        .layout-v3-sidebar {
            background: #1A1A1A !important;
            border-right: 1px solid #333333 !important;
        }

        .layout-v3-sidebar-header {
            background: #ffffff !important;
            border-bottom: 1px solid #e5e7eb !important;
        }

        .layout-v3-sidebar-logo {
            background: #6A0028 !important;
            color: #ffffff !important;
        }

        .layout-v3-sidebar-title {
            color: #1A1A1A !important;
        }

        .layout-v3-sidebar-toggle {
            background: #6A0028 !important;
            color: #ffffff !important;
        }

        .layout-v3-sidebar-toggle:hover {
            background: #8A0034 !important;
        }

        .layout-v3-nav-item {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            padding: 12px 16px !important;
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 14px !important;
        }

        .layout-v3-nav-item:hover {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.05) !important;
        }

        .layout-v3-nav-item.active {
            color: #ffffff !important;
            background: #6A0028 !important;
        }

        .layout-v3-nav-item svg {
            width: 18px !important;
            height: 18px !important;
            flex-shrink: 0 !important;
        }

        .layout-v3-sidebar-footer {
            border-top: 1px solid #333333 !important;
        }

        .layout-v3-sidebar-logout {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        /* 오버레이 강제 숨김 (버그 수정) */
        .layout-v3-sidebar-overlay {
            display: none !important;
        }

        .layout-v3-sidebar-overlay.active {
            display: block !important;
        }

        .layout-v3-sidebar-logout:hover {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.05) !important;
        }

        /* Tailwind Blue → Crimson 전체 오버라이드 */
        .bg-blue-50 { background-color: #FCE4EC !important; }
        .bg-blue-500 { background-color: #6A0028 !important; }
        .bg-blue-600 { background-color: #8A0034 !important; }
        .text-blue-600 { color: #6A0028 !important; }
        .border-blue-500 { border-color: #6A0028 !important; }
        .hover\:bg-blue-600:hover { background-color: #8A0034 !important; }
        .hover\:text-blue-600:hover { color: #6A0028 !important; }

        /* 사이드바 링크 - Active만 크림슨 */
        .sidebar-link {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        .sidebar-link.active {
            background-color: #6A0028 !important;
            color: #ffffff !important;
        }

        .sidebar-link:hover {
            background-color: rgba(255, 255, 255, 0.05) !important;
            color: #ffffff !important;
        }

        /* 테이블 헤더 높이 통일 */
        .table-header {
            height: 60px !important;
            padding: 12px 20px !important;
            flex-wrap: nowrap !important;
        }

        /* 테이블 행 높이 통일 */
        table th, table td {
            padding: 12px 12px !important;
        }

        /* 버튼 클릭 가능하도록 보장 */
        button {
            pointer-events: auto !important;
            cursor: pointer !important;
        }

        button:disabled {
            pointer-events: none !important;
            opacity: 0.5 !important;
        }
    </style>
</head>
<body class="layout-v3 bg-gray-100">

        <!-- 메인 콘텐츠 영역 -->

        <!-- 유틸리티 헤더 -->

    <!-- Layout v3 JavaScript -->
    <script>
        // 사이드바 토글 함수
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.querySelector('.layout-v3-main-content');
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        }

        // 모바일 메뉴 토글 함수
        window.toggleMobileMenu = function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-menu-overlay');
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
        };

        // 화면 전환 함수
        function showScreen(screenId) {
            // 모든 화면 숨기기
            document.querySelectorAll('.content-screen').forEach(screen => {
                screen.classList.remove('active');
            });

            // 선택된 화면 표시
            const targetScreen = document.getElementById(screenId + '-screen');
            if (targetScreen) {
                targetScreen.classList.add('active');
            }

            // 사이드바 active 상태 업데이트
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.remove('active');
            });
            const activeLink = document.querySelector(`[data-screen="${screenId}"]`);
            if (activeLink) {
                activeLink.classList.add('active');
            }

            // 브레드크럼 업데이트
            updateBreadcrumb(screenId);

            // 화면별 초기화 함수 호출
            if (screenId === 'thesis-application' && typeof initThesisApplication === 'function') {
                initThesisApplication();
            } else if (screenId === 'thesis-submission' && typeof initThesisSubmission === 'function') {
                initThesisSubmission();
            } else if (screenId === 'journal-submission' && typeof initJournalSubmission === 'function') {
                initJournalSubmission();
            } else if (screenId === 'semester-guidance-plan' && typeof initStudentSemesterGuidancePlan === 'function') {
                initStudentSemesterGuidancePlan();
            } else if (screenId === 'guidance-status' && typeof initStudentGuidanceStatusList === 'function') {
                initStudentGuidanceStatusList();
            } else if (screenId === 'notice' && typeof initStudentNotice === 'function') {
                initStudentNotice();
            } else if (screenId === 'research-ethics' && typeof initStudentEthics === 'function') {
                initStudentEthics();
            } else if (screenId === 'thesis-schedule' && typeof initStudentSchedule === 'function') {
                initStudentSchedule();
            } else if (screenId === 'guidance-procedure' && typeof initStudentProcedure === 'function') {
                initStudentProcedure();
            } else if (screenId === 'exam-schedule') {
                setTimeout(() => {
                    if (typeof renderStudentExamScheduleScreen === 'function') {
                        renderStudentExamScheduleScreen();
                    }
                }, 50);
            } else if (screenId === 'advisor-assignment') {
                setTimeout(() => {
                    if (typeof renderStudentAdvisorAssignmentScreen === 'function') {
                        renderStudentAdvisorAssignmentScreen();
                    }
                }, 50);
            } else if (screenId === 'realtime-reservation' && typeof StudentMeetingList !== 'undefined') {
                StudentMeetingList.init();
            }

            // 모바일에서 화면 전환 시 사이드바 닫기
            if (window.innerWidth <= 768) {
                toggleMobileMenu();
            }
        }

        // 브레드크럼 업데이트
        function updateBreadcrumb(screenId) {
            const breadcrumbMap = {
                'dashboard': { depth1: '대시보드', depth2: null },
                // 논문 안내
                'notice': { depth1: '논문 안내', depth2: '공지사항' },
                'resources': { depth1: '논문 안내', depth2: '자료실' },
                'research-ethics': { depth1: '논문 안내', depth2: '연구윤리' },
                'thesis-schedule': { depth1: '논문 안내', depth2: '논문일정' },
                'guidance-procedure': { depth1: '논문 안내', depth2: '논문지도절차' },
                // 논문 제출
                'thesis-submission': { depth1: '논문 제출', depth2: '학위 논문 제출' },
                'journal-submission': { depth1: '논문 제출', depth2: '학술지 논문 제출' },
                'title-modification': { depth1: '논문 제출', depth2: '최종 논문 제목 수정' },
                // 논문 지도
                'advisor-assignment': { depth1: '논문 지도', depth2: '지도교수 배정' },
                'semester-guidance-plan': { depth1: '논문 지도', depth2: '학기별 지도 계획' },
                'guidance-status': { depth1: '논문 지도', depth2: '논문 지도 활동' },
                'realtime-reservation': { depth1: '논문 지도', depth2: '실시간 지도 예약' },
                // 논문 심사
                'evaluation-schedule': { depth1: '논문 심사', depth2: '심사일정현황' },
                'exam-schedule': { depth1: '논문 심사', depth2: '심사일정현황' }
            };

            const breadcrumb1depth = document.getElementById('breadcrumb-1depth');
            const breadcrumb2depth = document.getElementById('breadcrumb-2depth');
            const breadcrumbSeparator2 = document.getElementById('breadcrumb-separator-2');

            if (breadcrumbMap[screenId]) {
                const { depth1, depth2 } = breadcrumbMap[screenId];

                // 1depth 설정
                if (breadcrumb1depth) {
                    breadcrumb1depth.textContent = depth1;
                }

                // 2depth 설정
                if (depth2) {
                    if (breadcrumb2depth) {
                        breadcrumb2depth.textContent = depth2;
                        breadcrumb2depth.style.display = '';
                    }
                    if (breadcrumbSeparator2) {
                        breadcrumbSeparator2.style.display = '';
                    }
                } else {
                    if (breadcrumb2depth) {
                        breadcrumb2depth.style.display = 'none';
                    }
                    if (breadcrumbSeparator2) {
                        breadcrumbSeparator2.style.display = 'none';
                    }
                }
            }
        }

        // 알림 토글
        function toggleNotifications() {
            const dropdown = document.getElementById('notificationDropdown');
            dropdown.classList.toggle('hidden');
        }

        // 언어 전환
        function switchLanguage() {
            alert('영문 버전 준비 중입니다.');
        }

        // 로그아웃
        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                // 로그아웃 처리
                window.location.href = '/';
            }
        }

        // CSS 스타일 추가
        document.addEventListener('DOMContentLoaded', function() {
            const style = document.createElement('style');
            style.textContent = `
                .content-screen {
                    display: none;
                }
                .content-screen.active {
                    display: block;
                }
                .badge-count {
                    position: absolute;
                    top: -4px;
                    right: -4px;
                    background: #6A0028;
                    color: white;
                    font-size: 10px;
                    font-weight: bold;
                    padding: 2px 6px;
                    border-radius: 10px;
                    min-width: 18px;
                    text-align: center;
                }
            `;
            document.head.appendChild(style);
        });
    </script>
