<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>논문 지도 시스템 - 학생용 (Design System v3)</title>

    <!-- Pretendard Variable Font -->
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Design System v3 (NEW) - Crimson Theme -->
    <link rel="stylesheet" href="../professor-v3/assets/css/design-system-v3.css">
    <link rel="stylesheet" href="../professor-v3/assets/css/components-v3.css?v=20251219003">
    <link rel="stylesheet" href="../professor-v3/assets/css/table-standard.css">

    <!-- Layout System v3 (NEW) - Crimson Layout -->
    <link rel="stylesheet" href="../professor-v3/assets/css/layout-v3.css?v=20241229001">

    <!-- 기존 기능 유지를 위한 CSS (특수 기능용) -->
    <link rel="stylesheet" href="../professor-v3/assets/css/style.css">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Crimson Color Override -->
    <style>
        /* 전역 CSS 변수 오버라이드 */
        :root {
            --primary: #6A0028 !important;
            --primary-dark: #4A001C !important;
            --primary-light: #8A0034 !important;
        }

        /* 사이드바 검정 배경 + Active만 크림슨 */
        .layout-v3-sidebar {
            background: #1A1A1A !important;
            border-right: 1px solid #333333 !important;
        }

        .layout-v3-sidebar-header {
            background: #ffffff !important;
            border-bottom: 1px solid #e5e7eb !important;
        }

        .layout-v3-sidebar-logo {
            background: #6A0028 !important;
            color: #ffffff !important;
        }

        .layout-v3-sidebar-title {
            color: #1A1A1A !important;
        }

        .layout-v3-sidebar-toggle {
            background: #6A0028 !important;
            color: #ffffff !important;
        }

        .layout-v3-sidebar-toggle:hover {
            background: #8A0034 !important;
        }

        .layout-v3-nav-item {
            display: flex !important;
            align-items: center !important;
            gap: 10px !important;
            padding: 12px 16px !important;
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 14px !important;
        }

        .layout-v3-nav-item:hover {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.05) !important;
        }

        .layout-v3-nav-item.active {
            color: #ffffff !important;
            background: #6A0028 !important;
        }

        .layout-v3-nav-item svg {
            width: 18px !important;
            height: 18px !important;
            flex-shrink: 0 !important;
        }

        .layout-v3-sidebar-footer {
            border-top: 1px solid #333333 !important;
        }

        .layout-v3-sidebar-logout {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        .layout-v3-sidebar-logout:hover {
            color: #ffffff !important;
            background: rgba(255, 255, 255, 0.05) !important;
        }

        /* Tailwind Blue → Crimson 전체 오버라이드 */
        .bg-blue-50 { background-color: #FCE4EC !important; }
        .bg-blue-500 { background-color: #6A0028 !important; }
        .bg-blue-600 { background-color: #8A0034 !important; }
        .text-blue-600 { color: #6A0028 !important; }
        .border-blue-500 { border-color: #6A0028 !important; }
        .hover\:bg-blue-600:hover { background-color: #8A0034 !important; }
        .hover\:text-blue-600:hover { color: #6A0028 !important; }

        /* 사이드바 링크 - Active만 크림슨 */
        .sidebar-link {
            color: rgba(255, 255, 255, 0.8) !important;
        }

        .sidebar-link.active {
            background-color: #6A0028 !important;
            color: #ffffff !important;
        }

        .sidebar-link:hover {
            background-color: rgba(255, 255, 255, 0.05) !important;
            color: #ffffff !important;
        }

        /* 테이블 헤더 높이 통일 */
        .table-header {
            height: 60px !important;
            padding: 12px 20px !important;
            flex-wrap: nowrap !important;
        }

        /* 테이블 행 높이 통일 */
        table th, table td {
            padding: 12px 12px !important;
        }

        /* 버튼 클릭 가능하도록 보장 */
        button {
            pointer-events: auto !important;
            cursor: pointer !important;
        }

        button:disabled {
            pointer-events: none !important;
            opacity: 0.5 !important;
        }
    </style>
</head>
<body class="layout-v3 bg-gray-100">

    <!-- 메인 레이아웃 v3 - Crimson Design System -->
    <div class="layout-v3-container">

        <!-- 좌측 사이드바 v3 -->
        <aside id="sidebar" class="layout-v3-sidebar">
            <!-- 사이드바 헤더 -->
            <div class="layout-v3-sidebar-header">
                <div class="layout-v3-sidebar-logo-area">
                    <div class="layout-v3-sidebar-logo">H</div>
                    <span class="layout-v3-sidebar-title">논문 지도 시스템</span>
                </div>
                <button class="layout-v3-sidebar-toggle" onclick="toggleSidebar()" title="사이드바 접기">
                    <div class="icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </div>
                </button>
            </div>

            <!-- 사이드바 네비게이션 -->
            <nav class="layout-v3-sidebar-nav">
                <!-- 대시보드 -->
                <a href="#" onclick="showScreen('dashboard'); return false;" data-screen="dashboard"
                   class="sidebar-link layout-v3-nav-item active">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                    </svg>
                    <span>대시보드</span>
                </a>

                <!-- 논문 제출 -->
                <div class="mt-2">
                    <div class="layout-v3-nav-item" style="cursor: default;">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <span>논문 제출</span>
                    </div>
                    <!-- 2depth 메뉴 -->
                    <div id="submission-submenu" class="pl-12 mt-1 space-y-1">
                        <a href="#" onclick="showScreen('thesis-submission'); return false;" data-screen="thesis-submission"
                           class="sidebar-link flex items-center p-2 rounded-lg text-sm transition-colors duration-200">
                            <span>학위논문 제출</span>
                        </a>
                        <a href="#" onclick="showScreen('journal-submission'); return false;" data-screen="journal-submission"
                           class="sidebar-link flex items-center p-2 rounded-lg text-sm transition-colors duration-200">
                            <span>학술지 논문 제출</span>
                        </a>
                    </div>
                </div>

                <!-- 논문지도 -->
                <div class="mt-2">
                    <div class="layout-v3-nav-item" style="cursor: default;">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        <span>논문지도</span>
                    </div>
                    <!-- 2depth 메뉴 -->
                    <div id="guidance-submenu" class="pl-12 mt-1 space-y-1">
                        <a href="#" onclick="showScreen('weekly-guidance'); return false;" data-screen="weekly-guidance"
                           class="sidebar-link flex items-center p-2 rounded-lg text-sm transition-colors duration-200">
                            <span>주간 지도 기록</span>
                        </a>
                        <a href="#" onclick="showScreen('thesis-feedback'); return false;" data-screen="thesis-feedback"
                           class="sidebar-link flex items-center p-2 rounded-lg text-sm transition-colors duration-200">
                            <span>학위논문 피드백</span>
                        </a>
                    </div>
                </div>
            </nav>

            <!-- 사이드바 하단 -->
            <div class="layout-v3-sidebar-footer">
                <button class="layout-v3-sidebar-logout" onclick="logout()">
                    <div class="icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                    </div>
                    로그아웃
                </button>
            </div>
        </aside>

        <!-- 메인 콘텐츠 영역 -->
        <div class="layout-v3-main-content">

        <!-- 유틸리티 헤더 -->
        <header class="layout-v3-utility-header">
            <div class="layout-v3-utility-left">
                <!-- 햄버거 메뉴 -->
                <button id="sidebarToggle" class="layout-v3-sidebar-open-btn" onclick="toggleSidebar()" title="사이드바 열기">
                    <div class="icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </div>
                </button>

                <!-- 브레드크럼 -->
                <div class="layout-v3-breadcrumb">
                    <span>홈</span>
                    <span class="layout-v3-breadcrumb-separator">></span>
                    <span class="layout-v3-breadcrumb-current">대시보드</span>
                </div>
            </div>

            <!-- 유틸리티 메뉴 -->
            <div class="layout-v3-utility-right">
                <div class="layout-v3-utility-menu">
                    <!-- 알림 -->
                    <button onclick="toggleNotifications()" class="layout-v3-utility-icon-btn" title="알림">
                        <div class="icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                            </svg>
                        </div>
                        <span id="notificationBadge" class="badge-count">3</span>
                    </button>

                    <!-- 알림 드롭다운 -->
                    <div id="notificationDropdown"
                         class="hidden absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg border z-50"
                         style="top: 60px;">
                        <div class="p-4 border-b flex items-center justify-between">
                            <h3 class="font-semibold text-[#1A1A1A]">알림</h3>
                            <span class="inline-flex items-center justify-center min-w-[24px] h-6 px-2 text-xs font-bold text-white bg-[#6A0028] rounded-full">3</span>
                        </div>
                        <div id="notificationList" class="max-h-96 overflow-y-auto">
                            <!-- JavaScript로 동적 생성 -->
                        </div>
                    </div>

                    <!-- 영문버전 전환 -->
                    <button onclick="switchLanguage()"
                            class="flex items-center justify-center w-10 h-10 hover:bg-gray-100 rounded-lg transition-colors"
                            title="Switch to English">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
                        </svg>
                    </button>
                </div>

                <!-- 사용자 정보 -->
                <div class="layout-v3-user-info">
                    <span class="layout-v3-user-role">학생</span>
                    <span class="layout-v3-user-divider">│</span>
                    <span id="userName" class="layout-v3-user-name">홍길동</span>
                </div>
            </div>
        </header>

        <!-- 콘텐츠 영역 -->
        <main class="layout-v3-content-area">

            <!-- 대시보드 화면 -->
            <section id="dashboard-screen" class="content-screen active">
                <div class="bg-white rounded-lg shadow-md p-8">
                    <div class="text-center text-gray-500">
                        <p class="text-lg">대시보드 콘텐츠 준비 중입니다.</p>
                    </div>
                </div>
            </section>

            <!-- 학위논문 제출 화면 -->
            <section id="thesis-submission-screen" class="content-screen">
                <div id="thesis-submission-content">
                    <!-- JavaScript로 동적 렌더링 -->
                </div>
            </section>

            <!-- 학술지 논문 제출 화면 -->
            <section id="journal-submission-screen" class="content-screen">
                <div id="journal-submission-content">
                    <!-- JavaScript로 동적 렌더링 -->
                </div>
            </section>

            <!-- 주간 지도 기록 화면 (읽기 전용) -->
            <section id="weekly-guidance-screen" class="content-screen">
                <div class="bg-white rounded-lg shadow-md p-8">
                    <div class="text-center text-gray-500">
                        <p class="text-lg">주간 지도 기록 콘텐츠 준비 중입니다.</p>
                    </div>
                </div>
            </section>

            <!-- 학위논문 피드백 화면 (읽기 전용) -->
            <section id="thesis-feedback-screen" class="content-screen">
                <div class="bg-white rounded-lg shadow-md p-8">
                    <div class="text-center text-gray-500">
                        <p class="text-lg">학위논문 피드백 콘텐츠 준비 중입니다.</p>
                    </div>
                </div>
            </section>

        </main>
        </div> <!-- /layout-v3-main-content -->
    </div> <!-- /layout-v3-container -->

    <!-- 사이드바 오버레이 (모바일용) -->
    <div id="mobile-menu-overlay" class="layout-v3-sidebar-overlay" onclick="toggleMobileMenu()"></div>

    <!-- 모달 컨테이너 -->
    <div id="modal-container"></div>

    <!-- Layout v3 JavaScript -->
    <script>
        // 사이드바 토글 함수
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.querySelector('.layout-v3-main-content');
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        }

        // 모바일 메뉴 토글 함수
        window.toggleMobileMenu = function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-menu-overlay');
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
        };

        // 화면 전환 함수
        function showScreen(screenId) {
            // 모든 화면 숨기기
            document.querySelectorAll('.content-screen').forEach(screen => {
                screen.classList.remove('active');
            });

            // 선택된 화면 표시
            const targetScreen = document.getElementById(screenId + '-screen');
            if (targetScreen) {
                targetScreen.classList.add('active');
            }

            // 사이드바 active 상태 업데이트
            document.querySelectorAll('.sidebar-link').forEach(link => {
                link.classList.remove('active');
            });
            const activeLink = document.querySelector(`[data-screen="${screenId}"]`);
            if (activeLink) {
                activeLink.classList.add('active');
            }

            // 브레드크럼 업데이트
            updateBreadcrumb(screenId);

            // 모바일에서 화면 전환 시 사이드바 닫기
            if (window.innerWidth <= 768) {
                toggleMobileMenu();
            }
        }

        // 브레드크럼 업데이트
        function updateBreadcrumb(screenId) {
            const breadcrumbMap = {
                'dashboard': '대시보드',
                'thesis-submission': '학위논문 제출',
                'journal-submission': '학술지 논문 제출',
                'weekly-guidance': '주간 지도 기록',
                'thesis-feedback': '학위논문 피드백'
            };

            const breadcrumbCurrent = document.querySelector('.layout-v3-breadcrumb-current');
            if (breadcrumbCurrent && breadcrumbMap[screenId]) {
                breadcrumbCurrent.textContent = breadcrumbMap[screenId];
            }
        }

        // 알림 토글
        function toggleNotifications() {
            const dropdown = document.getElementById('notificationDropdown');
            dropdown.classList.toggle('hidden');
        }

        // 언어 전환
        function switchLanguage() {
            alert('영문 버전 준비 중입니다.');
        }

        // 로그아웃
        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                // 로그아웃 처리
                window.location.href = '/';
            }
        }

        // CSS 스타일 추가
        document.addEventListener('DOMContentLoaded', function() {
            const style = document.createElement('style');
            style.textContent = `
                .content-screen {
                    display: none;
                }
                .content-screen.active {
                    display: block;
                }
                .badge-count {
                    position: absolute;
                    top: -4px;
                    right: -4px;
                    background: #6A0028;
                    color: white;
                    font-size: 10px;
                    font-weight: bold;
                    padding: 2px 6px;
                    border-radius: 10px;
                    min-width: 18px;
                    text-align: center;
                }
            `;
            document.head.appendChild(style);
        });
    </script>

    <!-- JavaScript 파일들 -->
    <script src="assets/js/app.js?v=20260107001"></script>
    <script src="assets/js/thesis-submission.js?v=20260107001"></script>
    <script src="assets/js/journal-submission.js?v=20260107001"></script>

</body>
</html>
