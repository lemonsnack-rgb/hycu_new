<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한양사이버대학교 - 논문지도 관리 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- 공식 UI 가이드라인 폰트 -->
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            background: #009DE8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
        }

        h1 {
            color: #333;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            font-weight: 400;
        }

        .role-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .role-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            text-decoration: none;
            display: block;
        }

        .role-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #009DE8;
        }

        .role-card.student {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .role-card.professor {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .role-card.admin {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .role-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .role-card h2 {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .role-card p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .subtitle {
                font-size: 16px;
            }

            .role-selection {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">HYCU</div>
            <h1>논문지도 관리 시스템</h1>
            <p class="subtitle">한양사이버대학교 대학원</p>
        </div>

        <div class="role-selection">
            <a href="student/student-dashboard.html" class="role-card student">
                <div class="role-icon">🎓</div>
                <h2>학생 (기존)</h2>
                <p>논문지도 계획 조회 및<br>제출 관리</p>
            </a>

            <a href="student-v3/student-dashboard.html" class="role-card student">
                <div class="role-icon">🎓</div>
                <h2>학생 (v3)</h2>
                <p>논문 제출 및<br>학술지 투고 관리</p>
            </a>

            <a href="professor/professor-dashboard-proposal.html" class="role-card professor">
                <div class="role-icon">👨‍🏫</div>
                <h2>교수 (기존)</h2>
                <p>지도학생 관리 및<br>피드백 작성</p>
            </a>

            <a href="professor-v3/professor-dashboard-proposal.html" class="role-card professor">
                <div class="role-icon">👨‍🏫</div>
                <h2>교수 (v3)</h2>
                <p>지도학생 관리 및<br>피드백 작성</p>
            </a>

            <a href="admin/admin-dashboard.html" class="role-card admin">
                <div class="role-icon">⚙️</div>
                <h2>관리자 (기존)</h2>
                <p>전체 시스템 관리 및<br>통계 확인</p>
            </a>

            <a href="admin-v3/index.html" class="role-card admin">
                <div class="role-icon">⚙️</div>
                <h2>관리자 (v3)</h2>
                <p>Design System v3 기반<br>관리자 대시보드</p>
            </a>
        </div>

        <div class="footer">
            <p>&copy; 2025 한양사이버대학교. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
